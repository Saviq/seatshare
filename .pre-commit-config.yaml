repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint (uv.lock)
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format (uv.lock)
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy static analysis (uv.lock)
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        always_run: true
